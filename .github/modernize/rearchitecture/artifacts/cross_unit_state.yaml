flows:
  - name: active extraction service project marker
    medium: static
    key: "SubtitleExtractionService.activeProjectId"
    writer:
      unit: extraction_service
      source_loc: "app/src/main/java/com/example/data/service/SubtitleExtractionService.kt:106"
    reader:
      unit: app_launcher
      source_loc: "app/src/main/java/com/example/MainActivity.kt:88"
    pairing: matched
    must_preserve: true
    must_confirm: null
    verification_hint: "Durante uma extração, confirmar que a Activity não marca o projeto ativo como abandonado; após encerramento, confirmar que o marcador volta a null."
    notes: "O valor também é limpo no finally, timeout e destruição do serviço; SubTranslateApp o consulta para decidir se fecha engines sob pressão de memória."
