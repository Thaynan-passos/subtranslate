units:
  - name: app_launcher
    trigger: page
    trigger_detail: "Android MAIN/LAUNCHER; MainActivity abre a lista de projetos e despacha rotas."
    source_anchors:
      - path: app/src/main/java/com/example/MainActivity.kt
        line: 42
      - path: app/src/main/java/com/example/SubTranslateApp.kt
        line: 8
    exported_signature:
      - method: "Activity MainActivity.onCreate(Bundle?)"
        source_loc: "app/src/main/java/com/example/MainActivity.kt:44"
        stability: must_preserve
    dynamic_entrypoints:
      - target: "com.example.SubTranslateApp"
        mechanism: xml-config
        source_loc: "app/src/main/AndroidManifest.xml:10"
      - target: "com.example.MainActivity"
        mechanism: xml-config
        source_loc: "app/src/main/AndroidManifest.xml:19"
    depends_on:
      - unit: project_library
        via: "rota projects e ProjectListScreen"
      - unit: project_setup
        via: "rota config e ProjectConfigScreen"
      - unit: processing_screen
        via: "rota processing/{id} e ProcessingScreen"
      - unit: subtitle_editor
        via: "rota editor/{id} e ReviewEditorScreen"
      - unit: subtitle_export
        via: "rota export/{id} e ExportScreen"
      - unit: settings
        via: "rota settings e SettingsScreen"
    shared_refs:
      - module: app_container
        used_fields: [projectRepository, settingsRepository, ocrEngine]
      - module: project_repository
        used_fields: [markAbandonedProcessingProjects]
      - module: settings_repository
        used_fields: [settings]

